name: Supabase Keep-Alive

on:
  schedule:
    # Alle 5 Tage um 08:00 UTC (Montag, Mittwoch, Freitag, Sonntag, Dienstag …)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Manuell auslösbar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://yjyqmpppwglktvcfcorh.supabase.co/rest/v1/methoden?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warnung: Supabase antwortet mit Status $STATUS"
            exit 1
          fi
          echo "Supabase ist erreichbar."
